name: Release

on:
  push:
    branches: [main]

# `contents: write` because `changeset publish` creates git tags and pushes them, and
# `pull-requests: write` because the same step opens the "Version Packages" PR.
#
# `id-token: write` now does double duty. It was here for provenance — the signed statement
# of which commit and workflow built each tarball — and it is also the whole of how this
# workflow authenticates to npm. There is no publish token: the registry trusts an OIDC
# token minted by this repository, for this workflow file, and nothing else. A stolen
# secret is not a thing that can happen to a secret that does not exist.
permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Changesets writes the changelog from the commits since the last release, so it
          # needs the history, not a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          # Not optional, and not only for provenance: this is what tells npm which registry
          # to present the OIDC token to. Without it the publish falls back to looking for a
          # token that is deliberately not here.
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing landed in npm 11.5.1; Node 22 still bundles npm 10.9, so the
      # runner's default npm would fail this with an authentication error rather than
      # anything that names OIDC. Pinned rather than `@latest` so a release is never the
      # first thing to meet a new npm major. `npm ci` below runs on this same npm.
      - name: npm new enough to publish with OIDC
        run: |
          npm install -g npm@11
          npm --version

      - run: npm ci

      # The same gate every PR passes. A release that skipped it would be the one build
      # nobody checked — and it is the one that reaches other people's machines.
      - run: npm run verify

      # Either opens/updates the "Version Packages" PR, or — when that PR has just been merged
      # and version files are already bumped — publishes. All twelve move in lockstep
      # (`fixed: [["@blaeu/*"]]`), so there is never a partial release where a preset depends
      # on a plugin version that does not exist yet.
      #
      # v2 is not a drop-in for v1, and the way it is not is the dangerous way: Actions does not
      # error on unrecognised `with:` keys. A bare `@v1` -> `@v2` bump therefore stays valid
      # YAML and silently stops doing the job — `version`/`publish` would be ignored, so
      # `changeset version` would never run and no release would ever be cut, with a green tick
      # on the run. The v2 renames, all of which this step used:
      #   version -> version-script   publish -> publish-script
      #   commit  -> commit-message   title   -> pr-title
      # and the token moved out of the environment into the `github-token` input, because v2
      # removed `GITHUB_TOKEN` as an authentication path entirely.
      - name: Create the release PR, or publish
        uses: changesets/action@v2
        with:
          # v2 defaults this to `${{ github.token }}`, which is the same value; passing it is
          # what keeps the step honest if the workflow ever moves to a PAT or an app token.
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: npx changeset version
          publish-script: npx changeset publish
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
        env:
          # No `NODE_AUTH_TOKEN`, and its absence is the design rather than an omission.
          # `@blaeu/*` publishes through npm trusted publishing: npm exchanges the OIDC token
          # granted by `id-token: write` above for a short-lived, single-purpose credential
          # scoped to this repository and this workflow file. Setting `NODE_AUTH_TOKEN` to an
          # empty string here — which is what an unset `secrets.NPM_TOKEN` would expand to —
          # is worse than setting nothing, because npm then finds a credential, believes it,
          # and fails with a 401 instead of reaching for OIDC at all.
          #
          # Bootstrap, recorded because it is the one step this file cannot perform: a trusted
          # publisher is configured on a package that already exists, so the *first* version of
          # each of the twelve has to be published with a token before any of this applies.
          #
          # Signed attestation of which commit and workflow built each tarball. For a library
          # that will sit under cadastral software, "where did this artefact come from" is a
          # question with a real answer rather than a shrug. Trusted publishing generates it
          # anyway; stating it keeps the intent readable and survives the auth mode changing.
          NPM_CONFIG_PROVENANCE: true
