name: Release

on:
  push:
    branches: [main]

# `changeset publish` creates git tags and pushes them; `--provenance` needs an OIDC token.
permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Changesets writes the changelog from the commits since the last release, so it
          # needs the history, not a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          # Required for provenance: it points npm at the registry the OIDC token is for.
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # The same gate every PR passes. A release that skipped it would be the one build
      # nobody checked — and it is the one that reaches other people's machines.
      - run: npm run verify

      # Either opens/updates the "Version Packages" PR, or — when that PR has just been merged
      # and version files are already bumped — publishes. All twelve move in lockstep
      # (`fixed: [["@blaeu/*"]]`), so there is never a partial release where a preset depends
      # on a plugin version that does not exist yet.
      - name: Create the release PR, or publish
        uses: changesets/action@v2
        with:
          version: npx changeset version
          publish: npx changeset publish
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Signed attestation of which commit and workflow built each tarball. For a library
          # that will sit under cadastral software, "where did this artefact come from" is a
          # question with a real answer rather than a shrug.
          NPM_CONFIG_PROVENANCE: true
