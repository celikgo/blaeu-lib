name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # 03:00 UTC. The browser and mutation suites then run against whatever maplibre and
    # Chromium resolved to overnight — the drift a lockfile-pinned PR run cannot see.
    - cron: '0 3 * * *'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # `npm ci` is the strict, lockfile-exact install CI wants.
      - run: npm ci
      # boundaries + typecheck + lint + test + build — the same gate `npm run verify`
      # runs locally, so a green PR here means a green PR there.
      - run: npm run verify
      - run: npm run format:check

  # The peer range is a promise, and the job above cannot check it: `npm ci` installs the one
  # maplibre-gl the lockfile names, so every run tests exactly one point inside `>=4.7.0 <7`.
  #
  # That gap has already cost us once. `MapLibreRenderer` cleaned up listeners via the return
  # value of `map.on(...).unsubscribe()`, which is maplibre 5 API; on maplibre 4 `on()` returns
  # the map, so `destroy()` threw — and the throw escaped `whenLoaded`'s `load` handler before it
  # could resolve, so `mount()` hung forever on *every* v4 host. The suite stayed green
  # throughout, because the fake maplibre map returned a v5-shaped subscription.
  #
  # So: type-check the renderer against the floor and the ceiling of the declared range on every
  # PR. Cheap (one tsc, no build, no browser) and it is the only thing standing between the
  # manifest and a peer range that is merely aspirational.
  peer-range:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - maplibre: '4.7.0' # the declared floor, exactly
            label: floor
          - maplibre: '^5' # the middle major, still widely deployed
            label: mid
          - maplibre: '^6' # the current major — WebGL2-only, ESM-only
            label: ceiling
    name: peer-range (maplibre ${{ matrix.label }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # `--no-save` so the matrix can never quietly rewrite the lockfile from CI.
      - run: npm i -D --no-save maplibre-gl@${{ matrix.maplibre }} -w @blaeu/core
      # Resolved *from @blaeu/core*, not from the root: npm nests the override only when the
      # hoisted copy cannot satisfy it, so a hard-coded packages/core/node_modules path is
      # missing on exactly the legs that hoist — and a version echo that crashes is worse than
      # none. This prints whichever copy `tsc` is about to read.
      - name: Show the maplibre-gl @blaeu/core resolves
        run: |
          node -e "console.log('resolved maplibre-gl', require(require.resolve('maplibre-gl/package.json', { paths: ['./packages/core'] })).version)"
      # Type-check only. The renderer's own suite runs against a fake maplibre map, so it proves
      # nothing about a real major; `tsc` against the real .d.ts is what catches a moved API.
      - run: npx tsc -p packages/core/tsconfig.json --noEmit

  # Everything above this line resolves `@blaeu/*` to **source**, through the tsconfig `paths`
  # and the vitest aliases. That is deliberate and good — no build step to run the tests — but
  # it means nothing in this repository has ever executed `dist`, and nothing has ever seen a
  # tarball. A 126-agent audit missed two packaging faults for exactly that reason: a scaffold
  # that deleted `plugin-select`'s runtime dependencies (invisible, because npm hoists them to
  # the root anyway) and a CJS entry point that could not load on the declared engine floor.
  #
  # So: build it, pack it, install the tarballs into a throwaway project, and use them.
  pack-and-consume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The declared `engines.node` floor, not the newest. Node 22.12+ added `require(esm)`,
          # which papers over exactly the class of dependency-format bug this job exists to catch.
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Pack every publishable workspace
        run: |
          mkdir -p /tmp/tarballs
          npm pack --workspaces --pack-destination /tmp/tarballs
          ls -la /tmp/tarballs

      - name: Every tarball ships a licence and a README
        run: |
          fail=0
          shopt -s nullglob
          tarballs=(/tmp/tarballs/blaeu-core-*.tgz /tmp/tarballs/blaeu-plugin-*.tgz /tmp/tarballs/blaeu-preset-*.tgz)
          if [ ${#tarballs[@]} -ne 12 ]; then
            echo "::error::expected 12 publishable tarballs, found ${#tarballs[@]}"
            exit 1
          fi
          for t in "${tarballs[@]}"; do
            for required in package/LICENSE package/README.md; do
              if ! tar -tzf "$t" | grep -qx "$required"; then
                echo "::error::$(basename "$t") is missing $required"
                fail=1
              fi
            done
          done
          exit $fail

      - name: Install the tarballs into a throwaway project
        run: |
          mkdir -p /tmp/consume && cd /tmp/consume
          echo '{"name":"consume","private":true,"version":"1.0.0","type":"module"}' > package.json
          npm i --no-audit --no-fund /tmp/tarballs/blaeu-core-*.tgz \
            /tmp/tarballs/blaeu-plugin-*.tgz /tmp/tarballs/blaeu-preset-*.tgz \
            maplibre-gl@^5 typescript

      - name: Import every published entry point
        working-directory: /tmp/consume
        run: |
          node --input-type=module -e '
            const mods = ["@blaeu/core","@blaeu/core/testing","@blaeu/plugin-draw",
              "@blaeu/plugin-snap","@blaeu/plugin-edit","@blaeu/plugin-select",
              "@blaeu/plugin-measure","@blaeu/plugin-history","@blaeu/plugin-topology",
              "@blaeu/plugin-ui","@blaeu/preset-cadastre","@blaeu/preset-game",
              "@blaeu/preset-urban"]
            let bad = 0
            for (const m of mods) {
              try { await import(m); console.log("  ok  ", m) }
              catch (e) { bad++; console.log("  FAIL", m, e.code ?? "", String(e.message).split("\n")[0]) }
            }
            process.exit(bad ? 1 : 0)
          '

      - name: A consumer type-checks against the published .d.ts
        working-directory: /tmp/consume
        run: |
          # `skipLibCheck: true` on purpose, and it is not a cop-out: with it false, the run
          # drowns in TS2834 from maplibre's own transitive types (@maplibre/geojson-vt,
          # @maplibre/vt-pbf), which are not ours to fix. What this proves is what we control —
          # that our declarations resolve under NodeNext and that our public API type-checks.
          # `attw` below is the tool that actually audits how the types are wired.
          cat > tsconfig.json <<'JSON'
          {
            "compilerOptions": {
              "target": "ES2022", "module": "NodeNext", "moduleResolution": "NodeNext",
              "strict": true, "noEmit": true, "skipLibCheck": true, "types": []
            },
            "include": ["consume.ts"]
          }
          JSON
          cat > consume.ts <<'TS'
          import { createBlaeuMap, type BlaeuFeature } from '@blaeu/core'
          import { drawPlugin } from '@blaeu/plugin-draw'
          import { snapPlugin } from '@blaeu/plugin-snap'
          import { editPlugin } from '@blaeu/plugin-edit'
          import { cadastrePreset } from '@blaeu/preset-cadastre'

          export async function main(): Promise<void> {
            const map = await createBlaeuMap({
              container: '#map',
              preset: cadastrePreset({ crs: 'EPSG:5254' }),
              plugins: [snapPlugin({ tolerance: 12 }), drawPlugin(), editPlugin()],
            })
            // The typed plugin registry has to survive the .d.ts round trip — no cast here.
            map.plugin('draw').start('polygon')
            const parcel: BlaeuFeature | undefined = map.store.find('p')
            void parcel
          }
          TS
          npx tsc --noEmit -p tsconfig.json

      - name: publint + attw on every package
        run: |
          fail=0
          for d in packages/*/; do
            name=$(node -p "require('./$d/package.json').name")
            echo "── $name"
            npx --yes publint@0.3 "$d" || fail=1
            # `--profile esm-only` because that is what these packages are. Without it attw
            # reports two things we chose on purpose: a CJS-resolution warning (there is no CJS
            # build) and a node10 failure on the `./testing` subpath (node10 predates `exports`).
            npx --yes @arethetypeswrong/cli@0.18 --pack "$d" --profile esm-only || fail=1
          done
          exit $fail

  # Additive, and deliberately outside `npm run verify`. A WebGL browser is a different order
  # of cost and flakiness from `tsc` and a node runner, and a gate that is slow or flaky is a
  # gate people learn to skip. It proves the one thing the 710 node tests cannot: that MapLibre
  # accepts what we hand it, and that our pointer normalisation matches real DOM events.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # The headless shell only — the full Chromium download is far larger and nothing here
      # needs a headed browser. `--with-deps` installs the system libraries the shell needs.
      - run: npx playwright install --with-deps chromium-headless-shell
      # No maplibre pin. The first two attempts at this pinned v5 and added an informational v6
      # leg, on the theory that the hit-testing failures were version-specific. CI disproved it:
      # the same tests fail on v5 here. The real axis is whether the environment has a GPU, and
      # this runner does not — so the suite probes for a render pass and skips the four
      # render-dependent tests when there is none, announcing it every run.
      - run: npm run test:browser

  # Nightly only. A full mutation run is minutes, not seconds, and its output is a number to
  # read rather than a gate to trip: `break` sits at the measured floor so the score can only
  # ratchet upward. The reason it exists at all is that the July audit found 86 real defects
  # behind a green suite at 88% line coverage — coverage answers "was this line run", and the
  # question that matters is "if this line were wrong, would anything fail".
  mutation:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:mutation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation
